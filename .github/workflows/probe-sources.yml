name: Probe data sources

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe candidate endpoints
        run: node scripts/probe-sources.mjs

      - name: Commit probe report
        run: |
          git config user.name "source-probe[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/_probe/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "probe: source endpoint recon report"
            git push
          fi
